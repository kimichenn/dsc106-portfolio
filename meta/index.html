<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../style.css" />
        <title>Meta Analysis</title>
    </head>
    <body>
        <h1>Meta Analysis</h1>
        <p>
            This page summarizes statistics about the code in this portfolio.
        </p>
        <label class="slider-label">
            <div>
                <span>Show commits until:</span>
                <input
                    type="range"
                    id="commit-progress"
                    min="0"
                    max="100"
                    value="100"
                />
            </div>
            <time id="commit-time"></time>
        </label>
        <div id="stats"></div>
        <h2>Commits by time of day</h2>
        <div id="scrolly-1">
            <div id="scatter-story"></div>
            <div id="scatter-plot">
                <div id="chart"></div>
                <p id="selection-count">No commits selected</p>
                <dl id="language-breakdown" class="stats"></dl>
            </div>
        </div>
        <h2>The race for the biggest file</h2>
        <div id="scrolly-2">
            <div id="files-story"></div>
            <div id="files-plot">
                <dl id="files"></dl>
            </div>
        </div>
        <dl id="commit-tooltip" class="info tooltip" hidden>
            <dt>Commit</dt>
            <dd>
                <a href="" id="commit-link" target="_blank"></a>
            </dd>

            <dt>Date</dt>
            <dd id="commit-date"></dd>

            <dt>Time</dt>
            <dd id="commit-tooltip-time"></dd>

            <dt>Author</dt>
            <dd id="commit-author"></dd>

            <dt>Lines edited</dt>
            <dd id="commit-lines"></dd>
        </dl>

        <script type="module" src="../global.js"></script>
        <script type="module" src="main.js"></script>
    </body>
</html>
